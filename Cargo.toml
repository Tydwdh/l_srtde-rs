[package]
name = "l_srtde"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Rust implementation of the L-SRTDE algorithm for large-scale global optimization."
repository = "https://github.com/Tydwdh/l_srtde-rs"
readme = "README.md"
documentation = "https://docs.rs/l_srtde"
keywords = ["optimization", "evolutionary", "metaheuristic", "lsgo", "parallel"]
categories = ["algorithms", "mathematics", "science"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
rand = "0.10.1"
rand_distr = "0.6.0"
rayon = "1.11.0"

[[bench]]
name = "throughput"
harness = false
